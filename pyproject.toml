[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "labelradar"
version = "0.1.0"
description = "Regulatory drug label-change intelligence platform"
authors = [{ name = "Tejas Limaye" }]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110.0,<1.0.0",
    "uvicorn[standard]>=0.28.0,<1.0.0",
    "pydantic>=2.6.0,<3.0.0",
    "pydantic-settings>=2.2.0,<3.0.0",
    "neo4j>=5.18.0,<6.0.0",
    "sqlalchemy[asyncio]>=2.0.28,<3.0.0",
    "asyncpg>=0.29.0,<1.0.0",
    "pgvector>=0.2.5,<1.0.0",
    "httpx>=0.27.0,<1.0.0",
    "openai>=1.14.0,<2.0.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.0,<9.0.0",
    "pytest-asyncio>=0.23.5,<1.0.0",
    "pytest-mock>=3.12.0,<4.0.0",
    "pytest-cov>=4.1.0,<5.0.0",
    "ruff>=0.3.2,<1.0.0",
    "mypy>=1.9.0,<2.0.0",
    "respx>=0.21.1,<1.0.0",
]

[tool.ruff]
line-length = 110
target-version = "py312"
exclude = [
    ".git",
    ".venv",
    "venv",
    "__pycache__",
    "build",
    "dist",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["B008", "E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
filterwarnings = [
    "ignore::DeprecationWarning",
]
