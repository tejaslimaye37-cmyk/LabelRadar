name: CI - Lint & Test

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: labelradar
          POSTGRES_PASSWORD: labelradar_password
          POSTGRES_DB: labelradar
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      neo4j:
        image: neo4j:5.20-community
        env:
          NEO4J_AUTH: neo4j/labelradar_password
        ports:
          - 7687:7687
        options: >-
          --health-cmd "cypher-shell -u neo4j -p labelradar_password 'RETURN 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 6

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run Ruff Lint
        run: |
          ruff check .

      - name: Run Pytest with Coverage
        env:
          NEO4J_URI: bolt://localhost:7687
          NEO4J_USER: neo4j
          NEO4J_PASSWORD: labelradar_password
          DATABASE_URL: postgresql+asyncpg://labelradar:labelradar_password@localhost:5432/labelradar
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_USER: labelradar
          POSTGRES_PASSWORD: labelradar_password
          POSTGRES_DB: labelradar
          OPENAI_BASE_URL: http://localhost:11434/v1
          OPENAI_API_KEY: test-key
          LLM_MODEL: qwen2.5:latest
        run: |
          pytest -v --cov=app --cov-report=term-missing

