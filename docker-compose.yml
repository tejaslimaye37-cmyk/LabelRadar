services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: labelradar_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-labelradar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-labelradar_password}
      POSTGRES_DB: ${POSTGRES_DB:-labelradar}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-labelradar} -d ${POSTGRES_DB:-labelradar}"]
      interval: 5s
      timeout: 5s
      retries: 5

  neo4j:
    image: neo4j:5.20-community
    container_name: labelradar_neo4j
    restart: unless-stopped
    ports:
      - "7474:7474" # Neo4j Browser
      - "7687:7687" # Bolt protocol
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-labelradar_password}
      NEO4J_dbms_security_procedures_unrestricted: "apoc.*"
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u ${NEO4J_USER:-neo4j} -p ${NEO4J_PASSWORD:-labelradar_password} 'RETURN 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: labelradar_app
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      APP_NAME: LabelRadar
      APP_ENV: production
      DEBUG: "False"
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-labelradar_password}
      NEO4J_DATABASE: neo4j
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-labelradar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-labelradar_password}
      POSTGRES_DB: ${POSTGRES_DB:-labelradar}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-labelradar}:${POSTGRES_PASSWORD:-labelradar_password}@postgres:5432/${POSTGRES_DB:-labelradar}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-http://host.docker.internal:11434/v1}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-ollama}
      LLM_MODEL: ${LLM_MODEL:-qwen2.5:latest}
      OPENFDA_BASE_URL: https://api.fda.gov/drug/label.json
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  postgres_data:
  neo4j_data:
